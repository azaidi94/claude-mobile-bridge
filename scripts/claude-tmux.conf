# claude-tmux.conf — a "near-invisible" tmux for Claude Code sessions.
#
# Purpose: run Claude inside tmux so the bot can inject /clear, /compact,
# /context via `tmux send-keys` (accessibility-free, focus-free, works in any
# host terminal incl. Cursor). This config makes tmux behave as much like a
# plain terminal as possible — native colors, snappy TUI (status bar kept on).
#
# Used on a DEDICATED socket so it never touches your normal tmux:
#   tmux -L claude -f scripts/claude-tmux.conf new-session "claude …"

set -g status on                    # keep the tmux status bar visible
set -sg escape-time 0             # no ESC delay — Claude's TUI stays snappy
set -g history-limit 100000       # deep scrollback
set -g mouse on                   # trackpad scroll + click-to-position
set -g focus-events on            # pass focus in/out to the app
set -g set-titles off             # don't fight the host terminal's title
set -g destroy-unattached off     # keep the session alive if the client detaches
setw -g aggressive-resize on      # resize to the attached client, not the widest

# Truecolor / 256-color passthrough so Claude renders identically to a bare term.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc,xterm-ghostty:Tc"

# Keep the default Ctrl-b prefix but make single-key exit obvious if needed:
# detach with `Ctrl-b d`. Everything else behaves like a normal terminal.
