name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel queued runs on the same ref — a force-push or rapid follow-up push
# shouldn't burn minutes on a now-superseded SHA.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned by commit SHA (not mutable tags) per
      # GitHub's security-hardening guidance — a compromised tag on the
      # secret-scanner especially could silently exfiltrate secrets.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so the secret scan can diff the whole PR range.
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pin to match the version run locally — an unpinned setup-bun
          # resolves to whatever's latest, and behavioral drift between Bun
          # releases can mask or expose flakes (issue #55).
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
